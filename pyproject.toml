[project]
name = "vuurwag"
version = "0.1.0"
description = "Vuurwag - the HugeBraai Fire Watch: a braai-themed animated TUI for a Proxmox node"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "textual>=1.0",
  "textual-serve>=1.1",
]

[project.scripts]
vuurwag = "vuurwag.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vuurwag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
