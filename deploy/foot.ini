# ~vuurwag/.config/foot/foot.ini for the kiosk (install.sh --monitor puts it there once and then
# leaves your edits alone). After an edit: systemctl restart vuurwag-kiosk
#
# Font size rule: aim for about 160x45 cells, the full scene (from 158 columns the top(1) table
# splits in two side by side). With DejaVu Sans Mono:
#   1080p  -> size=11   (about 160x45)
#   1440p  -> size=14 or 15
#   4K     -> size=22 (about)
# Too few columns hides scenery. The font must have no programming ligatures: the art types
# ->, ==< and |=| literally (apt install fonts-dejavu).

[main]
font=DejaVu Sans Mono:size=11
term=foot
pad=8x8
initial-window-mode=fullscreen

[cursor]
style=block
blink=no

# The 8 ANSI colours the art is drawn in, bright = bold. foot's default palette looks washed out.
[colors]
alpha=1.0
background=000000
foreground=e6e6e6
regular0=000000
regular1=ff3b30
regular2=2ecc40
regular3=ffd500
regular4=3d7bff
regular5=ff4fd8
regular6=00e5ff
regular7=d0d0d0
bright0=707070
bright1=ff6b5e
bright2=5dff6f
bright3=ffe866
bright4=6f9fff
bright5=ff7fe6
bright6=66f0ff
bright7=ffffff
