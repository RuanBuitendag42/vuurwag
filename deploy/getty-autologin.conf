# Plain Linux console fallback (no cage/foot, no Wayland): autologin the vuurwag user on tty1 and run
# vuurwag on the VT. Use this INSTEAD of vuurwag-kiosk (systemctl disable --now vuurwag-kiosk first).
# install.sh --monitor creates the user and its ssh key; this drop-in is not installed by it.
#
#   mkdir -p /etc/systemd/system/getty@tty1.service.d
#   cp /opt/vuurwag/src/deploy/getty-autologin.conf /etc/systemd/system/getty@tty1.service.d/autologin.conf
#   systemctl daemon-reload && systemctl restart getty@tty1
#
# Then in /home/vuurwag/.profile (runs on the autologin):
#
#   if [ "$(tty)" = /dev/tty1 ]; then
#       setfont /usr/share/consolefonts/Uni3-TerminusBold32x16.psf.gz 2>/dev/null   # apt install fonts-terminus console-setup
#       exec /opt/vuurwag/.venv/bin/vuurwag --ssh root@127.0.0.1 --fps 8
#   fi
#
# Undo: rm /etc/systemd/system/getty@tty1.service.d/autologin.conf && systemctl daemon-reload && systemctl restart getty@tty1
# The VT has the 8 ANSI colours (bright = bold) the art is drawn in; it is 7-bit ASCII, so every glyph is in the console font.

[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin vuurwag --noclear %I $TERM
